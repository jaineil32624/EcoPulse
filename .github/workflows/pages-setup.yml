name: Pages setup probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-setup.yml']

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect / configure Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          R="$GITHUB_REPOSITORY"
          { echo "== GET pages"; gh api repos/$R/pages 2>&1 || true
            echo; echo "== POST pages (gh-pages)"; gh api -X POST repos/$R/pages -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>&1 || true
            echo; echo "== PUT pages (gh-pages)"; gh api -X PUT repos/$R/pages -f build_type=legacy -f 'source[branch]=gh-pages' -f 'source[path]=/' 2>&1 || true
            echo; echo "== GET pages after"; gh api repos/$R/pages 2>&1 || true
            echo; echo "== latest build"; gh api repos/$R/pages/builds/latest 2>&1 || true
          } > pages.txt
          cat pages.txt
          git init -q -b pages-probe && git add pages.txt
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm probe
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/$R.git" pages-probe
