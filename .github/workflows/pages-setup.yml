name: Pages setup probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-setup.yml']

permissions:
  contents: write
  pages: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect / configure Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/out && cd /tmp/out
          R="$GITHUB_REPOSITORY"
          { echo "== POST pages/builds"; gh api -X POST repos/$R/pages/builds 2>&1 || true
            sleep 60
            echo; echo "== builds"; gh api "repos/$R/pages/builds?per_page=3" --jq '.[]|[.status,.commit,.created_at,.error.message]|@tsv' 2>&1 || true
          } > pages.txt
          cat pages.txt
          git init -q -b pages-probe && git add pages.txt
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm probe
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/$R.git" pages-probe
