name: Build & Deploy (GitHub Pages)

# On every push to main:
#   1. npm ci + npm run build (tsc type-check + vite build)
#   2. publish dist/ to the `build-preview` branch (handy for inspecting the real build)
#   3. deploy dist/ to GitHub Pages
# If the build fails, the tail of the log is pushed to the `build-log` branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Push build log on failure
        if: failure()
        run: |
          mkdir -p /tmp/log && cd /tmp/log
          git init -q -b build-log
          { echo "commit: ${GITHUB_SHA}"; date -u; echo; tail -n 200 "$GITHUB_WORKSPACE/build.log" 2>/dev/null || echo "no build.log"; } > build.log
          git add build.log
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm "Build log for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-log

      - name: Publish dist/ to build-preview branch
        run: |
          cp -r dist /tmp/preview && cd /tmp/preview
          echo "${GITHUB_SHA}" > BUILD_SHA
          touch .nojekyll
          git init -q -b build-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" commit -qm "Build preview for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" build-preview

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
